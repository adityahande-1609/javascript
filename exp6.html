<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <button onclick="oprompt()">integer</button><br><br>
    <button onclick="tprompt()">float</button><br><br>
    <button onclick="oalert()">alert</button><br><br>
    <button onclick="state()">confirm</button><br><br>
    <button onclick="check()">check</button>
    <script>
        function tprompt(){
            let b = prompt("enter num2")
            let d =parseInt(b)
            console.log(d)
        }
        function oprompt(){
            let a = prompt("enter input")
            let e = parseFloat(a)
            console.log(e)
        }
        function check(){
            let str = prompt("enter value:")
            console.log(isNaN(str))
        }
        function oalert(){
            alert("hello")
        }
        function state(){
            confirm("are you sure")
        }
    </script>
</body>
