<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 400px;
            width: 400px;
            margin: auto;
            background-color: antiquewhite;
            padding: 20px;
        }
        .button{
            display: flex;
            align-items: center;
            margin: auto;
            padding: auto;
            border-radius: 5px;
            text-align: center;
        }
        .item{
            display: flex;
            align-items: center;
            margin: auto;
           padding: auto;
            border-radius: 5px; 
        }
    </style>
</head>
<body>
<div class="container">
    <button class="button" onfocus="ofocus()"> on focus</button><br>
    <button class="button" onclick="oclick()" ondblclick="dblclick()">on click</button><br>
    <button class="button" onblur="oblur()">on blur</button><br>
    <select class="item" onchange="ochange()" placeholder="on change" id="list">
        <option value="option 1">first</option>
        <option value="option 2">second</option>
    </select><br>
    <form id="myform">
    <input class="item" type="text" id="text" placeholder="entering input" oninput="oaccept()"><br>
    <input class="item" type="submit" id="submit"><br>
    <input class="item" type="reset" id="reset"><br>
    </form>
</div>
    <script>
        function ofocus(){
            console.log("element in focus")
        }
        function oclick(){
            console.log("clicked")
        }
        function dblclick(){
            console.log("double clicked")
        }
        function oblur(){
            console.log("button on blur")
        }
        function ochange(){
            console.log("element changed")
        }
        function oaccept(){
            console.log("User input")
        }
    </script>
</body>
</html>
