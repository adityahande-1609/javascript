<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>first javascript</h1>
    <script>
        let a=11,b=33,c=[1,2,3,4,5]
        document.write("<h3> first variable is : </h3>"+a+"<br>")
        document.write("<h3>the second variable is :</h3>"+b+"<br><br>")
        document.write("<h3>the array vaule is : </h3>")
        for(let i=0;i<5;i++){
            document.write(c[i]+" ")
        }
        if(a>b){
            document.write("<h3>the first variable is greater than second variable</h3>")
        }
        else{
            document.write("<h3>the second variable is greater than first variable</h3>")
        }
    </script>
</body>
</html>
