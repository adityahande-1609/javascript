<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <form id ="myform">
            <label >Name :</label>
            <input type="text" id="name">
            <label >Password:</label>
            <input type="password" id="passwrd">
            <input type="submit">
            <input type="reset">
        </form>
    </div>
    <script>
        let form = document.getElementById("myform");
        form.addEventListener("submit",function(event){

            event.preventDefault();
            let name_form = document.getElementById("name").value;
            console.log("name is ",name_form);
            let pass = document.getElementById("passwrd").value;
            console.log("the password is ", pass);
        })
    </script>
</body>
</html>
