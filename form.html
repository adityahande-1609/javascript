<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    .container{
        width: 400px;
        height: 400px;
        border: 1px solid black;
        margin: 0 auto;
        padding: 20px;
    }
    .fin{
        width: 100px;
        height: 30px;
        margin: 10px 10px 10px 0px;
    }
</style>
</head>
<body>
    <div class="container">
    <form action="">
        <h1 style="text-align: center;">FORM </h1><br>
        <label >Name </label><br>
        <input type="text" id="name"><br>
        <label >Password</label><br>
        <input type="password" id="password"><br>
        <label >Hobbies : </label>
        <input type="checkbox" id="hobbies" value="Reading">
        <label for="hobbies">Reading</label>
        <input type="checkbox" id="hobbies" value="Travelling">
        <label for="hobbies">Travelling</label>
        <input type="checkbox" id="hobbies" value="Cooking">
        <label for="hobbies">Cooking</label><br><br>
        <label >Gender : </label>
        <input type="radio" id="gender" name="gender" value="Male">
        <label for="gender">Male</label>
        <input type="radio" id="gender" name="gender" value="Female">
        <label for="gender">Female</label><br><br>
        <label for="discription">Tell us about yourself:</label><br>
        <textarea id="discription" rows="4" cols="50"></textarea><br>
        <input type="submit" value="Submit" class="fin" style="margin-left: 20%;">
        <input type="reset" value="Reset"class="fin">
    </form>
    </div>
</body>
</html>
